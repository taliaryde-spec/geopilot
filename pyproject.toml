[project]
name = "geopilot"
version = "0.1.0"
description = "A natural-language geospatial analysis agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastembed>=0.8.0",
    "geopandas>=1.1.4",
    "openai>=3.3.1",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pyproj>=3.7.2",
    "python-dotenv>=1.2.3",
    "socksio>=1.0.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[project.scripts]
geopilot = "geopilot.cli:main"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
extend-exclude = [".npm-cache", ".storage-analysis"]
